<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin: 0; width: 260px; background: #050505; color: #f4f1ea; font: 13px system-ui, sans-serif; }
  .wrap { padding: 18px; }
  .mark { letter-spacing: .5em; font-weight: 300; font-size: 13px; }

  .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(244,241,234,.3); }
  .on .dot { background: #f4f1ea; box-shadow: 0 0 8px #f4f1ea; }
  p { color: rgba(244,241,234,.45); font-size: 12px; line-height: 1.5; margin: 12px 0 0; }
</style></head><body><div class="wrap">
  <div class="mark">NOVA</div>
  <div class="st" id="st"><span class="dot"></span><span id="txt">Checking…</span></div>
  <p>Nova can see and control your tabs only while the Nova app is running on this laptop. Nothing is sent anywhere else.</p>
</div><script src="popup.js"></script></body></html>
